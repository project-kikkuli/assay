name: Replay verification mechanisms
on:
  push:
    branches: [main]
    paths:
      - 'experiments/outbox/**'
      - 'experiments/isolation/**'
      - 'experiments/compatibility/**'
      - '.github/workflows/mechanisms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-database-replays:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: assay-local-only
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Exclude recorded evidence from fresh-run artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = list(Path('experiments/outbox/results').glob('*.json'))
          paths += [Path('experiments/isolation/results.json'),
                    Path('experiments/isolation/performance.json'),
                    Path('experiments/compatibility/results.json')]
          for path in paths:
              path.unlink(missing_ok=True)
          PY
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.6'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.12.0'
      - name: Install locked experiment dependencies
        run: |
          python -m pip install 'psycopg[binary]==3.3.4'
          npm ci --prefix experiments/outbox --ignore-scripts --no-audit --no-fund
          npm ci --prefix experiments/compatibility --ignore-scripts --no-audit --no-fund
      - name: Real PostgreSQL and TypeScript effects, including expected counterexamples
        working-directory: experiments/outbox
        run: |
          python model.py --all
          python run_actual.py
          python -m unittest -v test_outbox.py
          python -O -m unittest -v test_outbox.py
      - name: Real PostgreSQL tenant boundaries and execution plans
        working-directory: experiments/isolation
        run: |
          python run.py
          python -m unittest -v test_checks.py test_run_controls.py
          python -O -m unittest -v test_checks.py test_run_controls.py
      - name: Mixed Python and TypeScript clients during a rolling schema change
        working-directory: experiments/compatibility
        run: |
          python verifier.py --output results.json
          python verifier.py --selftest
          python -O verifier.py --selftest
      - name: Preserve fresh evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: database-mechanism-evidence
          path: |
            experiments/outbox/results/*.json
            experiments/isolation/results.json
            experiments/isolation/performance.json
            experiments/compatibility/results.json
          if-no-files-found: error
          retention-days: 7
