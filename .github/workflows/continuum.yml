name: Continuum fresh lifecycle experiment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.9'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.12.0'
      - name: Prepare pinned toolchains, dependencies and browser
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          rustup default 1.91.1
          mkdir -p out/continuum-hosted
          ./continuum prepare | tee out/continuum-hosted/preparation.json
          node experiments/continuum/client/node_modules/@playwright/test/cli.js install-deps chromium
      - name: Test the evidence machinery and independent verifier
        run: |
          python -m unittest discover -s experiments/continuum -p 'test_evidence.py' -v
          python -m unittest discover -s experiments/continuum -p 'verifier_tests.py' -v
      - name: Exercise faults, deployment recovery, and cold-action versus reused evidence
        run: ./continuum all --output out/continuum-hosted
      - name: Upload measured public evidence, never signing keys or dependency trees
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: continuum-hosted-evidence
          path: out/continuum-hosted/*.json
          retention-days: 7
