name: Replay protected worker boundary
on:
  push:
    branches: [main]
    paths:
      - 'experiments/confinement/**'
      - '.github/workflows/confinement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  confinement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Discard recorded evidence in this ephemeral checkout
        run: python3 -c "from pathlib import Path; Path('experiments/confinement/evidence.json').unlink(missing_ok=True)"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check admission rejects missing and contradictory evidence
        working-directory: experiments/confinement
        run: |
          python -m unittest -v test_run.py
          python -O -m unittest -v test_run.py
      - name: Exercise actual containers and positive leakage controls
        run: python experiments/confinement/run.py
      - name: Retain fresh outcomes, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: confinement-evidence
          path: experiments/confinement/evidence.json
          if-no-files-found: error
          retention-days: 7
