name: Fresh fullstack public gate

on:
  workflow_dispatch:
    inputs:
      browser_workers:
        type: choice
        options: ['1', '2', '4']
        default: '2'
      repetitions:
        type: choice
        options: ['1', '3']
        default: '3'

permissions:
  contents: read

jobs:
  fresh-public-fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.6"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.12.0"

      - name: Install and verify pinned uv
        run: |
          python -m pip install --disable-pip-version-check "uv==0.12.3"
          test "$(uv --version | awk '{print $2}')" = "0.12.3"

      - name: Verify Docker is available
        run: docker version

      - name: Prepare fresh public fixture and owned local services
        id: prepare
        run: |
          mkdir -p out
          python - <<'PY'
          import json
          import subprocess
          import time
          from pathlib import Path

          started = time.perf_counter()
          completed = subprocess.run(["python", "tools/prepare_lab.py"], check=False)
          elapsed = time.perf_counter() - started
          state_path = Path("out/lab/state.json")
          state = json.loads(state_path.read_text()) if state_path.exists() else {}
          timing = {
              "claim": "fresh preparation and its component setup timings; not whole-job time",
              "prepare_lab_seconds": round(elapsed, 3),
              "component_seconds": state.get("setup_seconds", {}),
          }
          Path("out/setup-timing.json").write_text(json.dumps(timing, indent=2) + "\n")
          raise SystemExit(completed.returncode)
          PY

      - name: Install Chromium system dependencies after preparation
        working-directory: out/lab/fullstack
        run: |
          node node_modules/@playwright/test/cli.js install-deps chromium
          node node_modules/@playwright/test/cli.js install chromium

      - name: Run warm full gate against the fresh subject
        env:
          BROWSER_WORKERS: ${{ inputs.browser_workers }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import time
          from pathlib import Path

          command = [
              "uv", "run", "--python", "3.14.6",
              "experiments/fullstack/gate.py",
              "--subject", "out/lab/fullstack",
              "--output", "out/hosted-gate.json",
              "--workers", os.environ["BROWSER_WORKERS"],
              "--repeat", os.environ["REPETITIONS"],
              "--observe-http",
          ]
          started = time.perf_counter()
          completed = subprocess.run(command, check=False)
          timing_path = Path("out/setup-timing.json")
          timing = json.loads(timing_path.read_text()) if timing_path.exists() else {}
          timing["warm_gate_seconds"] = round(time.perf_counter() - started, 3)
          timing["warm_gate_exit_code"] = completed.returncode
          timing["logical_cpus"] = os.cpu_count()
          timing["memory_bytes"] = os.sysconf("SC_PAGE_SIZE") * os.sysconf("SC_PHYS_PAGES")
          timing_path.write_text(json.dumps(timing, indent=2) + "\n")
          raise SystemExit(completed.returncode)
          PY

      - name: Upload fresh gate evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fresh-fullstack-gate-evidence
          path: |
            out/hosted-gate.json
            out/setup-timing.json
          if-no-files-found: error
          retention-days: 7

      - name: Stop only services owned by this preparation run
        if: always()
        run: |
          if [ -f out/lab/state.json ]; then
            python tools/prepare_lab.py --stop
          else
            echo "No owned service state was created; nothing to stop."
          fi
