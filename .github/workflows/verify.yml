name: Verify experiment
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Test runner, application, oracle, and reports
        run: python -m unittest discover -s tests -v
      - name: Test input invalidation and fail-closed experiment reports
        run: |
          python -m unittest discover -s experiments/python-selection -p 'test_*.py' -v
          python experiments/outbox-concurrency/test_concurrency.py
          python -m unittest discover -s experiments/confinement -p 'test_*.py' -v
      - name: Run the cold/warm, fault-injection, and performance demo
        run: python -m assay demo --out out
      - name: Preserve independently generated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evidence-python-${{ matrix.python }}
          path: out/
          if-no-files-found: error
          retention-days: 7
