[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kikkuli-assay"
version = "0.1.0"
description = "Experimental explainable verification and deterministic counterexamples"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
assay = "assay.__main__:main"

[tool.setuptools.packages.find]
include = ["assay*", "examples*"]
